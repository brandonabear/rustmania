[package]
name = "rustmania"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = { version = "2.13.2", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"

[dev-dependencies]
dhat = "0.3"

[lints.cargo]
unused_dependencies = "allow"
